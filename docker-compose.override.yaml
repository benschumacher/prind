## Ustreamer base Service
x-ustreamer-svc: &ustreamer-svc
  image: mkuf/ustreamer:latest
  restart: unless-stopped
  command: >
    --host=0.0.0.0
    --port=8080
    --slowdown
    --device=/dev/webcam
    --resolution=1280x800
    --format=MJPEG
    --desired-fps=30

## Add your personal config here
services:
  ## Klippy Services
  klipper:
    image: ghcr.io/benschumacher/ender3-v3-se-klipper-with-display:latest
    restart: unless-stopped
    privileged: true
    depends_on:
      init:
        condition: service_completed_successfully
    command: >
      -I printer_data/run/klipper.tty
      -a printer_data/run/klipper.sock
      printer_data/config/printer.cfg
      -l printer_data/logs/klippy.log
    volumes:
      - /dev:/dev
      - ./config:/opt/printer_data/config
      - run:/opt/printer_data/run
      - gcode:/opt/printer_data/gcodes
      - log:/opt/printer_data/logs
      - ./modules:/opt/printer_data/modules
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      org.prind.service: klipper

  moonraker:
    image: moonraker:kamp
    build:
      dockerfile_inline: |
        FROM alpine/git as pull
        RUN git clone https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging.git /opt/moonraker-kamp
        FROM mkuf/moonraker:latest
        USER root
        RUN    set -x \
            && apt update \
            && apt install ca-certificates curl \
            && install -m 0755 -d /etc/apt/keyrings \
            && curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc \
            && chmod a+r /etc/apt/keyrings/docker.asc
        RUN    set -x \
            && (echo \
                 "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $(. /etc/os-release && echo "$$VERSION_CODENAME") stable" \
                | tee /etc/apt/sources.list.d/docker.list > /dev/null \
               ) \
            && cat /etc/apt/sources.list.d/docker.list
        RUN    set -x \
            && apt update \
            && apt install -y --no-install-recommends neovim docker-ce-cli \
            && groupadd docker --gid 996 \
            && usermod moonraker --append --groups docker \
            && apt clean
        USER moonraker
        COPY --chown=moonraker:moonraker --from=pull /opt/moonraker-kamp /opt/moonraker-kamp
    healthcheck:
      disable: true
    volumes:
      - /opt/timelapse:/opt/timelapse
      - /dev/null:/opt/klipper/config/null
      - /dev/null:/opt/klipper/docs/null
      - /run/dbus:/run/dbus
      - /run/systemd:/run/systemd
      - ./config/moonraker.secrets:/opt/printer_data/moonraker.secrets
      - run:/opt/printer_data/run
      - gcode:/opt/printer_data/gcodes
      - log:/opt/printer_data/logs
      - moonraker-db:/opt/printer_data/database
      - ./config:/opt/printer_data/config
      - ./modules:/opt/printer_data/modules

  glances:
    image: nicolargo/glances:latest-full
    restart: unless-stopped
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      GLANCES_OPT: -w
    labels:
      org.prind.service: glances
      traefik.enable: true
      traefik.http.services.glances.loadbalancer.server.port: 61208
      traefik.http.middlewares.glances-redirect.redirectregex.regex: (^.*\/glances$$)
      traefik.http.middlewares.glances-redirect.redirectregex.replacement: $$1/
      traefik.http.middlewares.glances-redirect.redirectregex.permanent: false
      traefik.http.middlewares.glances-prefix.stripprefix.prefixes: /glances
      traefik.http.routers.glances.middlewares: glances-redirect,glances-prefix
      traefik.http.routers.glances.rule: PathPrefix(`/glances`)
      traefik.http.routers.glances.entrypoints: web

  traefik:
    image: traefik:3.6
    command:
      - "--accesslog=true"
      - "--accesslog.filters.statuscodes=100-399,500-599"
#      - "--log.level=ERROR"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"

  webcam:
    <<: *ustreamer-svc
    devices:
      - /dev/video0:/dev/webcam
    labels:
      org.prind.service: webcam
      traefik.enable: true
      traefik.http.services.webcam.loadbalancer.server.port: 8080
      traefik.http.routers.webcam.rule: PathPrefix(`/webcam`)
      traefik.http.routers.webcam.entrypoints: web
      traefik.http.middlewares.webcam.stripprefix.prefixes: /webcam
      traefik.http.routers.webcam.middlewares: webcam

